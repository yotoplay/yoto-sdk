name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: write
    packages: write
    issues: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            
            - uses: pnpm/action-setup@v4
              with:
                  version: 8
            
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"
                  registry-url: "https://registry.npmjs.org"
            
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm test
            - run: pnpm lint
            - run: pnpm type-check
            - run: pnpm run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}