name: CI and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
            version: 8
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup NPM
        run: |
          pnpm config set access public
          pnpm config set provenance true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run lint
        run: pnpm lint 
      - name: Run tests
        run: pnpm test 

      - name: Build
        run: pnpm run build

      - name: Get npm OIDC token
        run: |
          OIDC_RESPONSE=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm")
          echo "GitHub OIDC response keys: $(echo "$OIDC_RESPONSE" | jq 'keys')"
          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value')

          NPM_RESPONSE=$(curl -s -X POST "https://registry.npmjs.org/-/npm/v1/login/oidc" \
            -H "Content-Type: application/json" \
            -d "{\"oidcToken\": \"$OIDC_TOKEN\"}")
          echo "npm OIDC response keys: $(echo "$NPM_RESPONSE" | jq 'keys')"
          NPM_TOKEN=$(echo "$NPM_RESPONSE" | jq -r '.token')

          if [ "$NPM_TOKEN" = "null" ] || [ -z "$NPM_TOKEN" ]; then
            echo "::error::Failed to obtain npm OIDC token. Response: $(echo "$NPM_RESPONSE" | jq 'del(.token)')"
            exit 1
          fi

          echo "::add-mask::$NPM_TOKEN"
          echo "NODE_AUTH_TOKEN=$NPM_TOKEN" >> $GITHUB_ENV

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm semantic-release